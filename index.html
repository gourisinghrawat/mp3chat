<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Video Call Meeting</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel='stylesheet' type='text/css' media='screen' href='styles.css'>
</head>
<body>
    <!-- Initial Setup Screen -->
    <div class="container" id="setup-screen">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h3 class="card-title text-center mb-4">Video Call Meeting</h3>
                        <div class="mb-3">
                            <label for="display-name" class="form-label">Display Name</label>
                            <input type="text" class="form-control" id="display-name" placeholder="Enter your name" required>
                        </div>
                        <div class="mb-3">
                            <button id="create-meeting" class="btn btn-primary w-100">Create New Meeting</button>
                        </div>
                        <hr>
                        <div class="mb-3">
                            <label for="meeting-id-input" class="form-label">Meeting ID</label>
                            <input type="text" class="form-control" id="meeting-id-input" placeholder="Enter meeting ID to join">
                        </div>
                        <div class="mb-3">
                            <button id="join-meeting" class="btn btn-success w-100">Join Meeting</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Video Call Screen -->
    <div class="container-fluid" id="call-screen" style="display: none;">
        <div class="row">
            <!-- Video Section -->
            <div class="col-lg-8">
                <div class="row mb-3 mt-3">
                    <div class="col-12 mb-2">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <strong>Display Name:</strong> <span id="user-name"></span>
                            </div>
                            <div>
                                <strong>Meeting ID:</strong> <span id="current-meeting-id" class="badge bg-primary"></span>
                                <button id="copy-meeting-id" class="btn btn-sm btn-outline-secondary ms-2">Copy</button>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 mb-2">
                        <div class="btn-group" role="group">
                            <button id="toggle-video" class="btn btn-primary" title="Toggle Camera">
                                <i class="bi bi-camera-video-fill"></i> Camera On
                            </button>
                            <button id="toggle-audio" class="btn btn-primary" title="Toggle Microphone">
                                <i class="bi bi-mic-fill"></i> Mic On
                            </button>
                            <button id="share-screen" class="btn btn-success" title="Share Screen">
                                <i class="bi bi-display"></i> Share Screen
                            </button>
                            <button id="hangup" class="btn btn-danger">
                                <i class="bi bi-telephone-x-fill"></i> Leave Meeting
                            </button>
                        </div>
                    </div>
                </div>
                <div id="videos">
                    <div id="video-wrapper">
                        <div id="waiting" class="btn btn-warning">Waiting for participants...</div>
                        <video class="video-player" id="local-video" autoplay playsinline muted></video>
                    </div>
                    <div id="remote-videos-container">
                        <!-- Remote videos will be added here dynamically -->
                    </div>
                </div>
                <div class="row mt-3">
                    <div class="col-12">
                        <h5>Participants:</h5>
                        <div id="participants-list"></div>
                    </div>
                </div>
            </div>

            <!-- Chat Section -->
            <div class="col-lg-4">
                <div class="card mt-3" id="chat-container">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Chat</h5>
                    </div>
                    <div class="card-body" id="chat-messages" style="height: 500px; overflow-y: auto;">
                        <!-- Chat messages will appear here -->
                    </div>
                    <div class="card-footer">
                        <div class="input-group">
                            <input type="text" id="chat-input" class="form-control" placeholder="Type a message..." maxlength="500">
                            <button id="send-message" class="btn btn-primary">Send</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="/socket.io/socket.io.js"></script>
<script src='scripts.js'></script>
<script src='socketListeners.js'></script>
</html>
