<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Video Call Meeting</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel='stylesheet' type='text/css' media='screen' href='styles.css'>
</head>
<body>
    <!-- Initial Setup Screen -->
    <div class="container" id="setup-screen">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h3 class="card-title text-center mb-4">Video Call Meeting</h3>
                        <div class="mb-3">
                            <label for="display-name" class="form-label">Display Name</label>
                            <input type="text" class="form-control" id="display-name" placeholder="Enter your name" required>
                        </div>
                        <div class="mb-3">
                            <button id="create-meeting" class="btn btn-primary w-100">Create New Meeting</button>
                        </div>
                        <hr>
                        <div class="mb-3">
                            <label for="meeting-id-input" class="form-label">Meeting ID</label>
                            <input type="text" class="form-control" id="meeting-id-input" placeholder="Enter meeting ID to join">
                        </div>
                        <div class="mb-3">
                            <button id="join-meeting" class="btn btn-success w-100">Join Meeting</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Waiting Room Screen -->
    <div class="container" id="waiting-room-screen" style="display: none;">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
                <div class="card text-center">
                    <div class="card-body">
                        <div class="spinner-border text-primary mb-3" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <h4 class="card-title">In Waiting Room</h4>
                        <p class="card-text">Please wait for the host to let you in...</p>
                        <p class="text-muted">Meeting ID: <strong id="waiting-meeting-id"></strong></p>
                        <button id="cancel-join" class="btn btn-danger mt-3">Cancel</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Video Call Screen -->
    <div id="call-screen" style="display: none;">
        <!-- Top Header Bar -->
        <div id="top-header">
            <div class="header-left">
                <span id="user-name-display"></span>
                <span id="role-badge" class="badge bg-success ms-2" style="display: none;"></span>
            </div>
            <div class="header-center">
                <span class="meeting-id-label">Meeting ID: <strong id="current-meeting-id"></strong></span>
                <button id="copy-meeting-id" class="btn btn-sm btn-outline-light ms-2" title="Copy meeting link">
                    <i class="bi bi-link-45deg"></i> Copy Link
                </button>
            </div>
            <div class="header-right">
                <button id="toggle-chat" class="btn btn-sm btn-outline-light">
                    <i class="bi bi-chat-dots"></i> Chat
                </button>
            </div>
        </div>

        <!-- Main Content Area -->
        <div id="main-content">
            <!-- Video Grid Section -->
            <div id="video-grid-section">
                <div id="video-grid">
                    <!-- Videos will be added here dynamically -->
                </div>
                

            </div>

            <!-- Sidebar (Chat/Transcript) -->
            <div id="sidebar-panel" class="sidebar-hidden">
                <div class="sidebar-header">
                    <div class="nav nav-tabs" role="tablist">
                        <button class="nav-link active" id="chat-tab" data-bs-toggle="tab" data-bs-target="#chat-content" type="button" role="tab">
                            Chat
                        </button>
                        <button class="nav-link" id="participants-tab" data-bs-toggle="tab" data-bs-target="#participants-content" type="button" role="tab">
                            People (<span id="participant-count">0</span>)
                        </button>
                        <button class="nav-link" id="waiting-room-tab" data-bs-toggle="tab" data-bs-target="#waiting-room-content" type="button" role="tab" style="display: none;">
                            Waiting (<span id="waiting-count">0</span>)
                        </button>
                    </div>
                    <button id="close-sidebar" class="btn-close"></button>
                </div>
                <div class="sidebar-body">
                    <div class="tab-content">
                        <!-- Chat Tab -->
                        <div class="tab-pane fade show active" id="chat-content" role="tabpanel">
                            <div id="chat-messages">
                                <!-- Chat messages will appear here -->
                            </div>
                            <div class="chat-input-container">
                                <input type="text" id="chat-input" class="form-control" placeholder="Type a message..." maxlength="500">
                                <button id="send-message" class="btn btn-primary">
                                    <i class="bi bi-send-fill"></i>
                                </button>
                            </div>
                        </div>
                        <!-- Participants Tab -->
                        <div class="tab-pane fade" id="participants-content" role="tabpanel">
                            <div id="participants-list"></div>
                        </div>
                        <!-- Waiting Room Tab -->
                        <div class="tab-pane fade" id="waiting-room-content" role="tabpanel">
                            <div id="waiting-room-list-sidebar"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Control Bar -->
        <div id="bottom-controls">
            <div class="control-group">
                <button id="toggle-audio" class="control-btn" title="Toggle Microphone">
                    <i class="bi bi-mic-fill"></i>
                    <span class="control-label">Mute</span>
                </button>
                <button id="toggle-video" class="control-btn" title="Toggle Camera">
                    <i class="bi bi-camera-video-fill"></i>
                    <span class="control-label">Stop video</span>
                </button>
                <button id="share-screen" class="control-btn" title="Share Screen">
                    <i class="bi bi-display"></i>
                    <span class="control-label">Share</span>
                </button>
                <button id="raise-hand" class="control-btn" title="Raise Hand">
                    <i class="bi bi-hand-index-thumb"></i>
                    <span class="control-label">Raise</span>
                </button>
                <button id="toggle-chat" class="control-btn" title="Chat">
                    <span class="notification-badge" id="chat-badge" style="display: none;"></span>
                    <i class="bi bi-chat-dots-fill"></i>
                    <span class="control-label">Chat</span>
                </button>
                <button id="toggle-participants" class="control-btn" title="Participants">
                    <i class="bi bi-people-fill"></i>
                    <span class="control-label">People</span>
                </button>
                <button id="toggle-waiting-room" class="control-btn" title="Waiting Room" style="display: none;">
                    <span class="notification-badge" id="waiting-room-badge">0</span>
                    <i class="bi bi-hourglass-split"></i>
                    <span class="control-label">Waiting</span>
                </button>
                <button id="hangup" class="control-btn leave-btn" title="Leave Meeting">
                    <i class="bi bi-telephone-x-fill"></i>
                    <span class="control-label">Leave</span>
                </button>
            </div>
        </div>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src='scripts.js'></script>
<script src='socketListeners.js'></script>
</html>
